<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — moranetz pharmacy</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}
.card { max-width: 420px; }
.rx {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-bottom: 14px;
}
h1 {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(2rem, 8vw, 3rem);
  letter-spacing: 0.06em;
  text-transform: lowercase;
  color: #fff;
  margin-bottom: 10px;
}
p {
  font-weight: 300;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  line-height: 1.7;
  margin-bottom: 22px;
}
a.back {
  display: inline-block;
  padding: 10px 24px;
  border-radius: 8px;
  background: linear-gradient(135deg, rgba(180,120,40,0.7), rgba(160,100,30,0.5));
  border: 1px solid rgba(180,120,40,0.3);
  color: #e0d0b0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-decoration: none;
}
</style>
</head>
<body>
<main class="card">
  <div class="rx">&#8478; not in stock</div>
  <h1>404</h1>
  <p>This compound isn't on the shelf. The prescription may have been renamed, moved, or never filled.</p>
  <a class="back" href="/">Back to the pharmacy</a>
</main>
</body>
</html>
